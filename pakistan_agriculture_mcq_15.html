
<style>
  .qz{padding:1.5rem 0;font-size:15px}
  .pb-track{background:var(--color-border-tertiary);border-radius:4px;height:5px;margin-bottom:1.5rem}
  .pb-fill{height:5px;border-radius:4px;background:#3B6D11;transition:width .4s ease}
  .qhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
  .qnum{font-size:12px;color:var(--color-text-secondary)}
  .qdiff{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500}
  .dm{background:#E1F5EE;color:#0F6E56}.dh{background:#FAECE7;color:#993C1D}
  .qcat{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.55rem}
  .qtxt{font-size:15px;color:var(--color-text-primary);line-height:1.65;margin-bottom:1.1rem;font-weight:500}
  .opts{display:flex;flex-direction:column;gap:7px;margin-bottom:1.1rem}
  .ob{text-align:left;background:var(--color-background-primary);border:.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:.6rem .95rem;cursor:pointer;font-size:13.5px;color:var(--color-text-primary);transition:border-color .15s,background .15s;display:flex;gap:10px;align-items:flex-start}
  .ob:hover:not(:disabled){background:var(--color-background-secondary);border-color:var(--color-border-primary)}
  .ob.correct{background:#EAF3DE;border-color:#3B6D11;color:#173404}
  .ob.wrong{background:#FCEBEB;border-color:#A32D2D;color:#501313}
  .ob.show-correct{background:#EAF3DE;border-color:#3B6D11;color:#173404}
  .ol{font-weight:500;min-width:16px;color:var(--color-text-secondary);font-size:12px}
  .ob.correct .ol,.ob.show-correct .ol{color:#3B6D11}
  .ob.wrong .ol{color:#A32D2D}
  .fb{border-radius:var(--border-radius-md);padding:.7rem 1rem;font-size:13px;line-height:1.6;margin-bottom:1.1rem;border:.5px solid}
  .fbc{background:#EAF3DE;border-color:#639922;color:#27500A}
  .fbw{background:#FCEBEB;border-color:#E24B4A;color:#791F1F}
  .nav{display:flex;justify-content:space-between;align-items:center}
  .nb{padding:.5rem 1.3rem;border-radius:var(--border-radius-md);border:.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--color-text-primary)}
  .nb:disabled{opacity:.35;cursor:default}
  .sc{font-size:13px;color:var(--color-text-secondary)}
  .rp{text-align:center;padding:2rem 0}
  .rs{font-size:46px;font-weight:500;color:#3B6D11;line-height:1}
  .rl{font-size:13px;color:var(--color-text-secondary);margin-bottom:1.4rem}
  .rm{font-size:14.5px;color:var(--color-text-primary);line-height:1.65;margin-bottom:1.4rem;max-width:520px;margin-left:auto;margin-right:auto}
  .rb{padding:.55rem 1.5rem;border-radius:var(--border-radius-md);border:.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;font-size:13.5px;font-weight:500;color:var(--color-text-primary)}
  .rrow{display:flex;align-items:flex-start;gap:8px;text-align:left;padding:.55rem 0;border-bottom:.5px solid var(--color-border-tertiary);font-size:12.5px}
  .ri{min-width:16px}.bkd{max-width:560px;margin:.8rem auto 1.4rem}
</style>

<div class="qz">
  <div class="pb-track"><div class="pb-fill" id="prog" style="width:0%"></div></div>
  <div id="qa"></div>
</div>

<script>
const Q=[
  {
    q:"Agriculture accounts for approximately what share of Pakistan's labour force, while contributing only ~22% of GDP?",
    opts:["~20%","~28%","~37%","~45%"],
    ans:2,diff:"moderate",cat:"Sector overview",
    exp:"~37% of the labour force works in agriculture yet produces only ~22% of GDP — a classic productivity gap that drives rural poverty and reflects the Lewis dual-sector problem."
  },
  {
    q:"Within Pakistan's agricultural GDP, which sub-sector is the single largest component — a fact that surprises most students?",
    opts:["Crops (~38%)","Livestock (~61%)","Fisheries (~2%)","Forestry (~1%)"],
    ans:1,diff:"moderate",cat:"Sector structure",
    exp:"Livestock contributes ~61% of agricultural GDP and ~11% of total GDP — yet policy attention remains overwhelmingly focused on crops like wheat and cotton."
  },
  {
    q:"Pakistan uses approximately what share of its total freshwater resources for agriculture?",
    opts:["72%","85%","94%","99%"],
    ans:2,diff:"moderate",cat:"Water resources",
    exp:"Pakistan uses 94% of freshwater for agriculture — one of the highest rates globally and far above the South Asian average of 91%, making it acutely vulnerable to water stress."
  },
  {
    q:"Pakistan's wheat yield is approximately 2.85 MT/ha. What is China's comparable wheat yield?",
    opts:["3.1 MT/ha","4.2 MT/ha","5.42 MT/ha","6.8 MT/ha"],
    ans:2,diff:"moderate",cat:"Productivity & yields",
    exp:"China achieves 5.42 MT/ha for wheat vs. Pakistan's 2.85 MT/ha. The gap is not explained by resource endowment but by institutional quality, extension services, and input technology."
  },
  {
    q:"The average farm holding in Pakistan is 6.4 acres nationally. What is the average in KP, and why does this matter?",
    opts:["8.2 acres — too large for subsistence","5.6 acres — similar to Punjab","3.6 acres — too small to mechanize","12.5 acres — above the credit threshold"],
    ans:2,diff:"moderate",cat:"Land structure",
    exp:"KP's average farm size of 3.6 acres means mechanisation is not economically viable, terraced fields make it physically impossible, and farmers are trapped in low-productivity subsistence."
  },
  {
    q:"Which crop is described in the lectures as the most water-intensive yet politically protected, creating a 'policy paradox' in a water-scarce country?",
    opts:["Wheat","Cotton","Rice","Sugarcane"],
    ans:3,diff:"moderate",cat:"Crop political economy",
    exp:"Sugarcane has the highest water requirement of any major crop grown in Pakistan, yet mill owners and farmers lobby intensively to maintain support prices — a textbook example of rent-seeking overriding resource economics."
  },
  {
    q:"The 2022 floods caused approximately how much in agricultural losses specifically?",
    opts:["$1.2 billion","$3.7 billion","$7.5 billion","$12 billion"],
    ans:1,diff:"moderate",cat:"Climate vulnerability",
    exp:"The 2022 floods damaged 9 million acres of crops and caused $3.7 billion in agricultural losses specifically, with total economy-wide losses reaching ~$30 billion — wiping out two years of GDP gains."
  },
  {
    q:"What share of Pakistan's farmers rely on informal credit, and what are informal interest rates in distress periods?",
    opts:["~40–50%; rates of 10–15%","~60–70%; rates of 20–25%","~80–90%; rates approaching 50%","~95%; rates of 5–8%"],
    ans:2,diff:"hard",cat:"Rural credit",
    exp:"80–90% of farmers rely on informal credit because commercial banks generally do not lend to farms below 12.5 acres. In distress, informal rates approach 50% — trapping farmers in cycles of debt to middlemen."
  },
  {
    q:"Pakistan's estimated annual post-harvest losses are valued at approximately how much, and which commodity suffers the highest percentage loss?",
    opts:["$1–2B; grains at 40%","$4–5B; fruits & vegetables at up to 40%","$8–10B; cotton at 35%","$500M; rice at 25%"],
    ans:1,diff:"hard",cat:"Post-harvest losses",
    exp:"Post-harvest losses are estimated at $4–5 billion annually. Fruits and vegetables suffer losses of up to 40% due to the absence of cold chains, while grains lose up to 20% — largely preventable with logistics investment."
  },
  {
    q:"The Lewis dual-sector model applied to Pakistan's agriculture predicts that as labour moves from agriculture to industry, agricultural wages should rise and productivity should increase. Why has this NOT worked as expected in Pakistan?",
    opts:[
      "Agriculture wages are legally capped by the government",
      "Industry has not grown fast enough to absorb surplus agricultural labour",
      "Farmers prefer to stay in agriculture due to support prices",
      "Foreign remittances have made agricultural wages irrelevant"
    ],
    ans:1,diff:"hard",cat:"Development economics",
    exp:"The Lewis mechanism requires a growing industrial sector to pull labour out of agriculture. Pakistan's industrial stagnation means agriculture remains overcrowded and low-productivity — the structural transformation is stalled."
  },
  {
    q:"Which of the following best describes the 'collateral trap' that prevents smallholder farmers from accessing formal bank credit?",
    opts:[
      "Banks require farmers to have a university degree as proof of creditworthiness",
      "No land title → no formal loan; many smallholders lack updated Fard records; land digitisation incomplete",
      "Farmers refuse bank loans due to Islamic finance concerns",
      "The SBP has banned agricultural lending to farms below 5 acres"
    ],
    ans:1,diff:"hard",cat:"Rural credit",
    exp:"Without documented land title (Fard), farmers cannot pledge collateral. Land record digitisation is incomplete across provinces, trapping smallholders in informal credit markets where middlemen capture the harvest at below-market prices."
  },
  {
    q:"Wheat support prices in Pakistan have created what unintended long-run consequence in irrigated Punjab?",
    opts:[
      "A surge in wheat exports that crowded out rice",
      "A near-monoculture in wheat that distorts land use and water allocation",
      "A collapse in wheat production due to over-procurement",
      "A shift of farmers into more profitable horticulture"
    ],
    ans:1,diff:"hard",cat:"Policy trade-offs",
    exp:"High guaranteed wheat prices make wheat the rational choice for farmers every season, creating a near-monoculture in irrigated Punjab. This distorts crop diversification, locks in water-intensive practices, and limits value addition."
  },
  {
    q:"The sugar sector in Pakistan is described as a textbook case of rent-seeking. Which sequence best describes the 'sugar cycle' as presented in the lectures?",
    opts:[
      "High cane price → bumper crop → export surplus → price crash → import ban",
      "High cane price set → mills resist paying farmers → arrears pile up → export allowed → domestic shortage → import permitted → next year's price politics",
      "Low support price → farmer protests → government capitulates → overproduction → export glut",
      "Mill privatisation → FDI inflows → efficiency gains → lower consumer prices"
    ],
    ans:1,diff:"hard",cat:"Crop political economy",
    exp:"The sugar cycle is a deliberate rent-extraction mechanism: mills delay payments to farmers, lobby for export windows that create domestic shortages, then trigger import permissions — recycling political influence each year."
  },
  {
    q:"Which provincial contrast in average farm size most clearly illustrates why a single federal agricultural policy cannot be uniformly effective across Pakistan?",
    opts:[
      "Punjab (5.6 acres) vs. Sindh (8.8 acres) — both irrigation-dependent",
      "KP (3.6 acres, terraced, rainfed) vs. Balochistan (22.7 acres, water-scarce, orchard-based)",
      "Punjab (5.6 acres, mechanised) vs. KP (3.6 acres, subsistence) alone",
      "Sindh (8.8 acres, feudal) vs. Punjab (5.6 acres, smallholder) alone"
    ],
    ans:1,diff:"hard",cat:"Provincial variation",
    exp:"KP's tiny terraced rainfed farms and Balochistan's large arid orchard holdings represent completely different agricultural realities — neither fits a policy designed for Punjab's irrigated wheat belt. The 18th Amendment devolved agriculture to provinces, but implementation capacity gaps remain."
  },
  {
    q:"The lectures identify five priority 'shifts' for reforming Pakistan's agriculture. Which of the following is NOT among them?",
    opts:[
      "From flood irrigation → efficient water use (drip/sprinkler)",
      "From support prices → safety nets (BISP expansion)",
      "From input subsidies → productivity investment (R&D, extension, seed systems)",
      "From smallholder farming → large commercial farm consolidation"
    ],
    ans:3,diff:"hard",cat:"Reform agenda",
    exp:"The five priority shifts are: subsidies→productivity; flood→efficient irrigation; support prices→safety nets; fragmented policy→provincial strategies; trader capture→farmer connectivity. Farm consolidation is explicitly NOT proposed — 80% of farms are below 12.5 acres and the political context makes consolidation unrealistic."
  }
];

let cur=0,score=0,done=[],letters=['A','B','C','D'];

function render(){
  const area=document.getElementById('qa');
  document.getElementById('prog').style.width=((cur/Q.length)*100)+'%';
  if(cur>=Q.length){showResults(area);return;}
  const q=Q[cur],answered=done[cur]!==undefined;
  area.innerHTML=`
    <div class="qhdr">
      <span class="qnum">Question ${cur+1} of ${Q.length}</span>
      <span class="qdiff ${q.diff==='moderate'?'dm':'dh'}">${q.diff}</span>
    </div>
    <div class="qcat">${q.cat}</div>
    <div class="qtxt">${q.q}</div>
    <div class="opts" id="opts">
      ${q.opts.map((o,i)=>`
        <button class="ob${answered?(i===q.ans?' show-correct':(done[cur]===i?' wrong':'')):''}
          " data-i="${i}" ${answered?'disabled':''}>
          <span class="ol">${letters[i]}</span><span>${o}</span>
        </button>`).join('')}
    </div>
    ${answered?`<div class="fb ${done[cur]===q.ans?'fbc':'fbw'}">
      <strong>${done[cur]===q.ans?'Correct.':'Incorrect.'}</strong> ${q.exp}
    </div>`:''}
    <div class="nav">
      <span class="sc">Score: ${score} / ${cur+(answered?1:0)}</span>
      <button class="nb" id="nb" ${!answered?'disabled':''}>
        ${cur<Q.length-1?'Next question →':'See results →'}
      </button>
    </div>`;

  if(!answered){
    document.querySelectorAll('.ob').forEach(b=>{
      b.addEventListener('click',()=>{
        const i=parseInt(b.dataset.i);
        done[cur]=i;
        if(i===Q[cur].ans)score++;
        render();
      });
    });
  }
  const nb=document.getElementById('nb');
  if(nb)nb.addEventListener('click',()=>{cur++;render();});
}

function showResults(area){
  document.getElementById('prog').style.width='100%';
  const pct=Math.round((score/Q.length)*100);
  const msg=pct>=80
    ?'Excellent command of Pakistan\'s agricultural sector — structure, productivity gaps, water constraints, political economy, and reform trade-offs. Well prepared for exam-level questions.'
    :pct>=60
    ?'Solid grasp of core concepts. Review the rural credit collateral trap, the Lewis model application, provincial farm size variation, and the five reform priorities before the exam.'
    :'Focus revision on: the productivity gap (employment vs. GDP share), the sugar cycle, the Lewis dual-sector mechanism, post-harvest losses, and why uniform federal agricultural policy fails.';
  area.innerHTML=`
    <div class="rp">
      <div class="rs">${score}/${Q.length}</div>
      <div class="rl">${pct}% — ${pct>=80?'Distinction level':pct>=60?'Satisfactory':'Needs revision'}</div>
      <div class="rm">${msg}</div>
      <div class="bkd">
        ${Q.map((q,i)=>`<div class="rrow">
          <span class="ri">${done[i]===q.ans?'✓':'✗'}</span>
          <span style="color:var(--color-text-secondary);font-size:11px;min-width:90px">${q.cat}</span>
          <span style="color:var(--color-text-primary)">${q.q.substring(0,65)}…</span>
        </div>`).join('')}
      </div>
      <button class="rb" id="restart">Restart quiz</button>
    </div>`;
  document.getElementById('restart').addEventListener('click',()=>{cur=0;score=0;done=[];render();});
}

render();
</script>
